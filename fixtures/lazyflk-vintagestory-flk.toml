# .lazyflk.toml: vintagestory-flk's own actions in lazyflk's menu (enter on
# the app or its machine). Each runs with sh -c in this directory, after
# lazyflk shows the expanded command and asks. {input} is asked for when the
# action runs: any one line of text, passed as data (never run as shell;
# lazyflk 4673104). Anything with sudo is only offered to copy.

[actions.status]
run  = "bin/vs-status --offline"
help = "one-screen overview: VM, players, storm, health, backups, disk"

[actions.who]
run  = "bin/vs-cmd list clients"
help = "who's online (console)"

[actions.stats]
run  = "bin/vs-cmd stats"
help = "server stats: uptime, memory, players (console)"

[actions.announce]
run  = "bin/vs-cmd announce {input}"
help = "broadcast a message to the players (console)"

[actions.save]
# /autosavenow flushes the save; wait for the offthread save to finish
run  = "flk -a {app} console {machine} --send /autosavenow --wait-log 'Offthread save of savegame done' --timeout 300"
help = "save the world now and wait until it's written (a flush, not a freeze)"

[actions.backup]
run  = "bin/vs-backup"
help = "the nightly backup, now: warns players, STOPS the server ~40s, copies, checks, starts it"

[actions.backup-check]
run  = "bin/vs-backup --check"
help = "preflight only: mounts, flk, lock, status; makes no backup"
